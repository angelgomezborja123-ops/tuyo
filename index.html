<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mi Rutina de Piernas</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>🦵 Mi Rutina Semanal</h1>

      <p>Completa tus retos y mejora poco a poco 💪</p>
    </header>

    <main>
      <section class="informacion">
        <h2 id="semanaTitulo">Semana</h2>

        <p id="fechaSemana"></p>
      </section>

      <section class="progreso">
        <h3>📊 Tu progreso</h3>

        <div class="barra">
          <div id="barraProgreso"></div>
        </div>

        <p id="porcentaje">0%</p>
      </section>

      <section id="rutina">
        <!-- JavaScript agregará los ejercicios -->
      </section>
    </main>

    <div id="mensaje" class="mensaje oculto">
      <div class="mensajeContenido">
        <h2 id="tituloMensaje"></h2>

        <p id="textoMensaje"></p>

        <button onclick="cerrarMensaje()">¡Seguir entrenando! 💪</button>
      </div>
    </div>

    <footer>
      <p>🦵 Entrena con constancia, descansa y cuida tu cuerpo 💙</p>
    </footer>

    <script src="scrip.js"></script>
  </body>
</html>
